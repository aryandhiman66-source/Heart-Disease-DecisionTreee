<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Heart Disease Risk Estimator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            padding: 30px;
        }
        .container {
            max-width: 700px;
            background: white;
            padding: 25px;
            border-radius: 8px;
            margin: auto;
        }
        h1 {
            text-align: center;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 6px;
            margin-top: 4px;
        }
        button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        .result {
            margin-top: 25px;
            padding: 15px;
            background: #eef2f7;
            border-radius: 6px;
        }
        .disclaimer {
            font-size: 12px;
            color: #555;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Heart Disease Risk Estimator</h1>

    <form id="riskForm">

        <label>Age
            <input type="number" id="age" min="18" max="100" required>
        </label>

        <label>Sex
            <select id="sex" required>
                <option value="">Select</option>
                <option value="0">Female</option>
                <option value="1">Male</option>
            </select>
        </label>

        <label>Chest Pain Type (cp)
            <select id="cp" required>
                <option value="">Select</option>
                <option value="0">Type 0</option>
                <option value="1">Type 1</option>
                <option value="2">Type 2</option>
                <option value="3">Type 3</option>
            </select>
        </label>

        <label>Resting Blood Pressure (trestbps)
            <input type="number" id="trestbps" min="80" max="200" required>
        </label>

        <label>Cholesterol (chol)
            <input type="number" id="chol" min="100" max="400" required>
        </label>

        <label>Fasting Blood Sugar (fbs)
            <select id="fbs" required>
                <option value="">Select</option>
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>
        </label>

        <label>Rest ECG (restecg)
            <select id="restecg" required>
                <option value="">Select</option>
                <option value="0">Normal</option>
                <option value="1">ST-T abnormality</option>
                <option value="2">LV hypertrophy</option>
            </select>
        </label>

        <label>Max Heart Rate (thalach)
            <input type="number" id="thalach" min="60" max="220" required>
        </label>

        <label>Exercise Induced Angina (exang)
            <select id="exang" required>
                <option value="">Select</option>
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>
        </label>

        <label>Oldpeak
            <input type="number" id="oldpeak" min="0" max="6" step="0.1" required>
        </label>

        <label>Slope
            <select id="slope" required>
                <option value="">Select</option>
                <option value="0">Upsloping</option>
                <option value="1">Flat</option>
                <option value="2">Downsloping</option>
            </select>
        </label>

        <label>CA
            <input type="number" id="ca" min="0" max="4" required>
        </label>

        <label>Thal
            <select id="thal" required>
                <option value="">Select</option>
                <option value="1">Normal</option>
                <option value="2">Fixed defect</option>
                <option value="3">Reversible defect</option>
            </select>
        </label>

        <button type="submit">Estimate Risk</button>
    </form>

    <div class="result" id="result" style="display:none;">
        <h3>Result</h3>
        <p><strong>Risk score:</strong> <span id="riskScore"></span></p>
        <p><strong>Risk level:</strong> <span id="riskLevel"></span></p>
    </div>

    <p class="disclaimer">
        This tool is for educational purposes only and does not provide medical advice.
    </p>
</div>

<script>
document.getElementById("riskForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
        age: Number(age.value),
        sex: Number(sex.value),
        cp: Number(cp.value),
        trestbps: Number(trestbps.value),
        chol: Number(chol.value),
        fbs: Number(fbs.value),
        restecg: Number(restecg.value),
        thalach: Number(thalach.value),
        exang: Number(exang.value),
        oldpeak: Number(oldpeak.value),
        slope: Number(slope.value),
        ca: Number(ca.value),
        thal: Number(thal.value)
    };

    try {
        const response = await fetch("http://127.0.0.1:5000/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
            alert(result.error || "Invalid input");
            return;
        }

        document.getElementById("result").style.display = "block";
        document.getElementById("riskScore").innerText = result.risk_score;
        document.getElementById("riskLevel").innerText = result.risk_level;

    } catch (err) {
        alert("Backend not reachable. Is Flask running?");
        console.error(err);
    }
});
</script>

</body>
</html>
